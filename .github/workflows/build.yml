name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir www && cp index.html manifest.json icon-192.png icon-512.png lame.min.js www/
      - run: npm install
      - run: npx cap add android
      - run: |
          D=android/app/src/main/java/com/resonar/eq
          mkdir -p $D
          cp MainActivity.java MediaService.java BgPlugin.java $D/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<service android:name="com.resonar.eq.MediaService" android:foregroundServiceType="mediaPlayback" android:exported="false" /></application>#' $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.FOREGROUND_SERVICE" /><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" /><uses-permission android:name="android.permission.WAKE_LOCK" /><uses-permission android:name="android.permission.POST_NOTIFICATIONS" /></manifest>#' $M
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: resonar-eq-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
